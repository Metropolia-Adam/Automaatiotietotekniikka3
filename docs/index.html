<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hävikki No More - Opiskelijan jääkaappi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🧊 Hävikki No More</h1>
    <p>Käytä pian vanhenevat ruoat ensin</p>
  </header>

  <main>
    <!-- V1 & V4: Tuotteen lisäyslomake ja virheilmoitus -->
    <section class="card">
      <h2>Lisää tuote</h2>
      <form id="add-product-form">
        <div class="input-group">
          <label for="product-name">Tuotteen nimi</label>
          <input type="text" id="product-name" placeholder="esim. kanafilee">
        </div>

        <div class="row">
          <div class="input-group">
            <label for="product-amount">Määrä</label>
            <input type="text" id="product-amount" placeholder="esim. 400g">
          </div>
          <div class="input-group">
            <label for="product-date">Parasta ennen</label>
            <input type="date" id="product-date">
          </div>
        </div>

        <!-- V4: Virheilmoituksen paikka (piilotettu oletuksena) -->
        <p id="error-message" class="error hidden"></p>

        <button type="submit" class="btn btn-primary">+ Lisää jääkaappiin</button>
      </form>
    </section>

    <!-- V2: Jääkaapin sisältö (esimerkkirivit näyttävät miltä värikoodit näyttävät) -->
    <section class="card">
      <h2>Jääkaapin sisältö</h2>
      <ul id="fridge-list" class="product-list">
        <!-- Esimerkki punaisesta (<= 2 pv) -->
        <li class="product-item urgent-red">
          <div class="product-info">
            <strong>Kanafileet</strong> (400g)
            <span class="days-left">Vanhenee huomenna!</span>
          </div>
          <button class="btn-delete" title="Poista">✕</button>
        </li>

        <!-- Esimerkki keltaisesta (<= 5 pv) -->
        <li class="product-item warning-yellow">
          <div class="product-info">
            <strong>Kermapurkki</strong> (2dl)
            <span class="days-left">4 päivää jäljellä</span>
          </div>
          <button class="btn-delete" title="Poista">✕</button>
        </li>

        <!-- Esimerkki normaalista -->
        <li class="product-item">
          <div class="product-info">
            <strong>Kananmunat</strong> (6 kpl)
            <span class="days-left">12 päivää jäljellä</span>
          </div>
          <button class="btn-delete" title="Poista">✕</button>
        </li>
      </ul>
    </section>

      <button id="suggest-recipes
